# Cleansed docker-compose.override.yml
# Removed paddlex mounts and conflicting image names
# Only contains container name overrides

name: lumina-django

services:
  postgres:
    container_name: lumina-django-postgres
  
  redis:
    container_name: lumina-django-redis
  
  backend:
    container_name: lumina-django-backend
  
  celery:
    container_name: lumina-django-celery
  
  celery-beat:
    container_name: lumina-django-celery-beat
  
  frontend:
    container_name: lumina-django-frontend